# Crowdin project configuration.
#
# Not active yet — Plozz has not applied for the open-source licence. Committed
# so the setup is a decision rather than a research exercise; see
# docs/translations.md for why Crowdin and what to verify before relying on it.
#
# Usage once a project exists:
#   export CROWDIN_PROJECT_ID=... CROWDIN_PERSONAL_TOKEN=...
#   crowdin push      # upload sources (English) to Crowdin
#   crowdin pull      # download translations back into the catalog
#
# Prefer the GitHub integration over running these by hand: it commits to an
# `l10n_` branch and opens ONE pull request, which is the whole reason for using
# a platform. Localizable.xcstrings is a single JSON file, so per-translator
# pull requests would conflict constantly.

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  # `multilingual: true` is what makes Crowdin treat one .xcstrings as the
  # source AND the target for every language, rather than expecting a file per
  # language. The translation path is the source path for the same reason.
  - source: /App/Resources/Localizable.xcstrings
    translation: /App/Resources/Localizable.xcstrings
    multilingual: true

  # Permission prompts. Separate per target because the wording differs: tvOS
  # names Jellyfin and Emby, iOS says "media servers" and additionally asks for
  # the camera.
  - source: /App/Resources/InfoPlist.xcstrings
    translation: /App/Resources/InfoPlist.xcstrings
    multilingual: true

  - source: /App/PlozziOS/InfoPlist.xcstrings
    translation: /App/PlozziOS/InfoPlist.xcstrings
    multilingual: true

# BEFORE TRUSTING THIS, verify three undocumented behaviours on a throwaway
# project (docs/translations.md explains why each matters):
#
#   1. Locale flooding. A 2024 report had Crowdin writing every locale it knows
#      into the exported catalog, which produces ITMS-90176 on App Store upload.
#      Check the pulled file contains only languages we configured.
#   2. `shouldTranslate: false` — is it honoured, or are those keys exposed to
#      translators anyway?
#   3. Comments. 960 keys carry a translator comment and that is the main
#      quality investment in this catalog. Confirm they reach the editor as
#      context; if they don't, the platform choice needs revisiting.
#
# Also confirm `xcrun xcstringstool sync` still works on a pulled file — key
# order and extractionState are not documented as preserved. Run
# `python3 tools/l10n-sync.py --check` after the first pull.
