name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test tvOS app
    runs-on: macos-15
    env:
      GIT_CONFIG_PARAMETERS: "'safe.bareRepository=all'"
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      # Fail fast on any module-layering violation before the (slow) project
      # generation + simulator build. Data-driven from `swift package
      # dump-package`; see tools/arch-guard.py for the enforced rules.
      - name: Architecture layering guard
        run: python3 tools/arch-guard.py

      # Localization regressions: brand names leaking into the catalog, copy
      # concatenated with `+` (which the extractor skips entirely, so the string
      # can never be translated), and migrated APIs reverting to `String`.
      # Any finding fails; see docs/localization.md for the rules.
      - name: Localization guard
        run: tools/l10n-guard.sh

      # Translation files are untrusted batch output. These regressions prove the
      # importer rejects the failures most likely to break at runtime: a plural
      # category dropping, adding, or changing a placeholder; direct-plural
      # categories disagreeing; unknown printf syntax; noncanonical locale tags;
      # and non-ASCII text failing a round trip.
      - name: Localization importer regression tests
        run: python3 -m unittest tools/tests/test_l10n_import.py

      # Validates the artifact translators actually receive: brands marked
      # non-translatable, no keys without words in them, every counted string
      # carrying plural variations, and the permission prompts in each
      # InfoPlist.xcstrings still matching the Info.plist they mirror.
      #
      # `--validate-only`: it reads the committed catalog and needs no toolchain.
      # A full `--check` also proves the catalog is in sync with the source, but
      # to do that it rebuilds BOTH platforms with string extraction enabled,
      # which roughly doubles CI time. Freshness is enforced locally instead —
      # docs/localization.md requires running tools/l10n-sync.py before
      # committing a string change.
      - name: Localization catalog validation
        run: python3 tools/l10n-sync.py --validate-only

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: tools/generate-project.sh

      - name: Build (tvOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Plozz.xcodeproj \
            -scheme Plozz \
            -destination 'generic/platform=tvOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run full test matrix (tvOS Simulator, build-once)
        run: tools/run-tests.sh
